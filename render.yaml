services:
  - type: web
    name: monday-founder-bi-agent
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: chainlit run app.py --host 0.0.0.0 --port $PORT --headless
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: MONDAY_API_KEY
        sync: false
      - key: WORK_ORDERS_BOARD_ID
        sync: false
      - key: DEALS_BOARD_ID
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
